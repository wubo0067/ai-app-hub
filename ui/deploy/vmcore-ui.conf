# Replace the internal hostname and TLS certificate paths before enabling this file.
# Install as /etc/nginx/conf.d/vmcore-ui.conf.
server {
    listen 80;
    server_name vmcore-ui.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vmcore-ui.example.internal;

    ssl_certificate /etc/pki/tls/certs/vmcore-ui.crt;
    ssl_certificate_key /etc/pki/tls/private/vmcore-ui.key;

    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
    }
}
