[site],,,
# 起始爬取页面
start_url = https://example.com/doc,ments/?

# 网站根地址（限制爬取范围）
base_url = https://example.com

[login]
# 是否需要登录
enable_login = true
# 登录页面（支持，JS 动态渲染的 SPA 页面）
login_url = https://example.com/login,,.

# 登录账号
username = your_account

# 登录密码
password = your_password

# --- 浏览器自动化选项 ---
# 是否使用无头模式（true=后台运行不显示窗口，false=可以看到浏览器操作）
browser_headless = false
# 等待登录完成的最长时间（秒），含 OAuth 跳转等
browser_timeout = 120

[download]
# 下载哪些文件
extensions = pdf,doc,docx,xls,xlsx,ppt,pptx

# 保存目录
save_dir = ./downloads

[crawler]
# 最大递归深度
max_depth = 5

# 每次请求间隔（秒）
delay_seconds = 0.5

# 请求超时
timeout = 15

# 已存在文件是否跳过
skip_existing = true

# 浏览器 UA
user_agent = Mozilla/5.0

proxy_enabled = true
proxy_http = http://proxy.xfusion.com:8080
proxy_https = http://proxy.xfusion.com:8080

# 详情页 URL 前缀（逗号分隔，匹配任意一个前缀即视为详情页，需要用浏览器点击下载按钮）
detail_page_prefix = https://w3.xfusion.com/sys/news/sys_news_main/sysNewsMain.do?method=view&fdld=

# 可递归爬取的页面 URL 前缀（逗号分隔），只递归匹配前缀的页面，防止爬遍整个网站
# 例如：要爬取分页列表页，设置为列表页的 URL 前缀
crawl_page_prefix = https://w3.xfusion.com/docs/news/

# 下载按钮文字（hover 时显示的中文提示，用于定位下载按钮）
download_button_text = 下载