  <rect x="96" y="870" width="520" height="116" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="7 6"/>
  <text x="124" y="902" class="box-title">RAG / 知识库现状</text>
  <text x="124" y="929" class="box-text">rag-preprocessing 中有 MD → DSL → DKB 数据链路</text>
  <text x="124" y="951" class="box-text">src/rag/retrieval.py 会加载 rcu_stall_dkb.json</text>
  <text x="124" y="973" class="box-text">但当前 graph.py 未注册 retrieval_rag_node，运行时主图未接入</text>
  <path d="M616 928 C690 906, 710 840, 672 814" class="arrow-dashed"/> -->
