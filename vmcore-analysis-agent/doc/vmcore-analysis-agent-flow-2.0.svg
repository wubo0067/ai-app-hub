  <rect x="96" y="1038" width="1360" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="120" y="1066" class="note">备注：source_patch MCP 工具在服务启动时被加载并绑定给 LLM，但当前 ReAct prompt 与 crash_tool_node 路由主要面向 crash 命令；补丁工具未形成独立执行节点。</text> -->
</svg>
